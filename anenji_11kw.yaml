    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Max charging current                                      0.1A    Uint  640 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} max charging current"
    use_write_multiple: true
    address: 640
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "A"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Max mains charging current                                0.1A    Uint  641 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} max mains charging current"
    use_write_multiple: true
    address: 641
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "A"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;
